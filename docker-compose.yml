version: "3.11"

services:
  api:
    build: .
    ports: 
      - "8000:8000"
    depends_on:
      - postgresql
    env_file:
      - .env

  postgresql:
    image: postgres:15
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: